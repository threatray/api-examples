[project]
name = "threatray-api-examples"
version = "1.0.0"
description = "Example scripts for the Threatray REST API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["threatray_client", "get_report"]
